name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      # Logs aren't always reachable from outside; surface the errors as an annotation.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          MSG=$(grep -E "^e: |^w: .*(error|Error)|Error:|error:|FAILED|What went wrong|^> |Execution failed" build.log \
            | head -80 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${MSG}"

      - name: Check APK size (hard cap 15 MB)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          LIMIT=$((15 * 1024 * 1024))
          MB=$(awk "BEGIN { printf \"%.2f\", $SIZE / 1048576 }")
          echo "APK: $APK ($MB MB, $SIZE bytes)"
          echo "### APK size: $MB MB (cap 15 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::APK is $MB MB, over the 15 MB cap"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports-${{ github.run_number }}
          path: app/build/reports/
          if-no-files-found: ignore
